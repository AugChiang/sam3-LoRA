device: &device 'cuda'
seed: &seed 42

dataset:
  input_img_dir: "./data/images"
  mask_dir: "./data/masks"
  annotation_path: "./data/annotation.json"

data:
  resolution: 1008

segmentation_model:
  model_type: "sam3"
  checkpoint_path: "./checkpoints/sam3.pt"
  bpe_path: "./checkpoints/bpe_simple_vocab_16e6.txt.gz"
  confidence_threshold: 0.5
  enable_inst_interactivity: False
  prompt: "dental instrument"

text_encoder:
  # Use any HuggingFace CLIP or SigLIP text model available in the environment.
  name: "openai/clip-vit-base-patch32"
  freeze: true
  use_safetensors: false

fusion:
  num_heads: 8

lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  bias: "none"
  target_modules:
    - "qkv"
    - "proj"
    - "out_proj"
    - "linear1"
    - "linear2"

training:
  epochs: 10
  batch_size: 1
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.0001
  val_fraction: 0.2
  alias_mode: "random"
  mixed_precision: true
  amp_dtype: "float16"
  dice_weight: 1.0
  focal_weight: 1.0
  grad_clip_norm: 1.0
  log_every: 1
  output_dir: "./outputs/sam3_lora"

inference:
  checkpoint: "./outputs/sam3_lora/best/checkpoint.pt"
  lora_dir: "./outputs/sam3_lora/best/lora"
  confidence_threshold: 0.5
  default_prompt: "dental instrument"
